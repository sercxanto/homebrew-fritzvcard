name: Test Homebrew installation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add Homebrew to PATH on Linux
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Use the proposed tap from this checkout
        if: github.event_name == 'pull_request'
        run: |
          git switch -c smoke-checkout
          brew tap sercxanto/tap "$GITHUB_WORKSPACE"
      - name: Install and test fritzvcard
        run: |
          brew install sercxanto/tap/fritzvcard
          brew test sercxanto/tap/fritzvcard
          fritzvcard version
